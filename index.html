<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOSH IPTV</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0d1117;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:95%;
    max-width:700px;
    background:#161b22;
    border-radius:15px;
    padding:35px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,255,255,.15);
}

h1{
    font-size:40px;
    margin-bottom:10px;
}

p{
    color:#b3b3b3;
    margin-bottom:25px;
}

.url{
    background:#0d1117;
    padding:15px;
    border-radius:10px;
    word-break:break-all;
    color:#00e5ff;
    font-size:15px;
}

button{
    margin-top:20px;
    background:#00b894;
    color:#fff;
    border:none;
    padding:15px 30px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#00a383;
}

.step{
    margin-top:30px;
    text-align:left;
}

.step h3{
    margin-bottom:10px;
}

.step li{
    margin:8px 0;
    color:#ddd;
}
</style>

</head>
<body>

<div class="card">

<h1>📺 JOSH IPTV</h1>

<p>Premium BDIX Streaming Playlist</p>

<div class="url" id="url">
https://joshbdix-tv.github.io/joshiptv/joshplaylist.m3u
</div>

<button onclick="copy()">📋 Copy Playlist URL</button>

<div class="step">

<h3>How to Use</h3>

<ol>
<li>Open Televizo IPTV Player</li>
<li>Select <b>Add Playlist</b></li>
<li>Choose <b>M3U URL</b></li>
<li>Paste the copied URL</li>
<li>Enjoy Streaming ❤️</li>
</ol>

</div>

</div>

<script>

function copy(){

navigator.clipboard.writeText("https://joshbdix-tv.github.io/joshiptv/joshplaylist.m3u");

alert("Playlist URL Copied!");

}

</script>

</body>
</html>
